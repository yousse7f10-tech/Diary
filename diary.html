<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2a1b3d">
<title>دفتر الذكريات | Memory Diary</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;600;700&family=Dancing+Script:wght@400;700&family=Tajawal:wght@300;400;500;700&family=Great+Vibes&display=swap" rel="stylesheet">

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
/* ========== RESET & BASE ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-family: 'Tajawal', sans-serif; user-select: none; -webkit-user-select: none; }
body {
  background: radial-gradient(ellipse at top, #3d2a5c 0%, #2a1b3d 40%, #1a0f2e 100%);
  color: #f5e6ff;
  position: fixed;
  width: 100%;
  touch-action: manipulation;
}

/* ========== BACKGROUND PARTICLES ========== */
.bg-particles { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
.particle {
  position: absolute;
  color: rgba(255, 180, 220, 0.6);
  font-size: 14px;
  pointer-events: none;
  animation: floatUp linear infinite;
  filter: drop-shadow(0 0 6px rgba(255, 150, 200, 0.5));
}
@keyframes floatUp {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
}

/* ========== WELCOME SCREEN ========== */
#welcome {
  position: fixed; inset: 0; z-index: 1000;
  background: radial-gradient(ellipse at center, #4a2c6d 0%, #2a1b3d 60%, #1a0f2e 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 1.2s ease, transform 1.2s ease;
}
#welcome.hidden { opacity: 0; transform: scale(1.1); pointer-events: none; }
.welcome-book {
  width: 180px; height: 220px;
  background: linear-gradient(135deg, #6b3d8a 0%, #4a2c6d 100%);
  border-radius: 4px 12px 12px 4px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 0 40px rgba(255,255,255,0.05);
  display: flex; align-items: center; justify-content: center;
  position: relative;
  animation: bookFloat 3s ease-in-out infinite;
  border-left: 8px solid #3d2a5c;
}
.welcome-book::before {
  content: ''; position: absolute; inset: 10px;
  border: 1px solid rgba(255, 200, 230, 0.3);
  border-radius: 2px 8px 8px 2px;
}
.welcome-book .heart { font-size: 60px; color: #ff9ec7; filter: drop-shadow(0 0 20px #ff6fa8); animation: heartPulse 1.5s ease-in-out infinite; }
@keyframes bookFloat { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-15px) rotate(2deg); } }
@keyframes heartPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
.welcome-title {
  font-family: 'Great Vibes', cursive;
  font-size: 52px;
  background: linear-gradient(135deg, #ffc0e0 0%, #ff9ec7 50%, #c89eff 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-top: 40px;
  text-shadow: 0 0 40px rgba(255, 158, 199, 0.5);
  letter-spacing: 2px;
}
.welcome-subtitle {
  font-family: 'Amiri', serif;
  font-size: 20px;
  color: #e0c3fc;
  margin-top: 10px;
  opacity: 0.85;
  letter-spacing: 1px;
}
.welcome-btn {
  margin-top: 50px;
  padding: 16px 48px;
  background: linear-gradient(135deg, #ff6fa8 0%, #c89eff 100%);
  border: none; border-radius: 50px;
  color: white; font-family: 'Tajawal', sans-serif;
  font-size: 18px; font-weight: 500;
  cursor: pointer;
  box-shadow: 0 10px 40px rgba(255, 111, 168, 0.4), inset 0 1px 0 rgba(255,255,255,0.3);
  transition: all 0.3s ease;
  position: relative; overflow: hidden;
}
.welcome-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 50px rgba(255, 111, 168, 0.6); }
.welcome-btn::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transform: translateX(-100%);
  transition: transform 0.6s;
}
.welcome-btn:hover::before { transform: translateX(100%); }

/* ========== LOADING ========== */
#loading {
  position: fixed; inset: 0; z-index: 999;
  background: #1a0f2e;
  display: none; align-items: center; justify-content: center;
  flex-direction: column;
}
.loader {
  width: 60px; height: 60px;
  border: 3px solid rgba(200, 158, 255, 0.2);
  border-top-color: #ff9ec7;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loader-text { margin-top: 20px; color: #e0c3fc; font-size: 16px; font-family: 'Amiri', serif; }

/* ========== MAIN APP ========== */
#app { position: fixed; inset: 0; display: flex; flex-direction: column; z-index: 10; }

/* Top Bar */
.topbar {
  height: 50px;
  background: linear-gradient(180deg, rgba(26, 15, 46, 0.95) 0%, rgba(26, 15, 46, 0.7) 100%);
  backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid rgba(200, 158, 255, 0.15);
  z-index: 20;
  flex-shrink: 0;
}
.topbar-title {
  font-family: 'Great Vibes', cursive;
  font-size: 26px;
  background: linear-gradient(135deg, #ffc0e0, #c89eff);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.topbar-btn {
  width: 38px; height: 38px;
  background: rgba(200, 158, 255, 0.1);
  border: 1px solid rgba(200, 158, 255, 0.2);
  border-radius: 50%;
  color: #e0c3fc;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.3s;
  font-size: 16px;
}
.topbar-btn:hover { background: rgba(255, 111, 168, 0.2); border-color: #ff9ec7; transform: scale(1.05); }
.topbar-left, .topbar-right { display: flex; gap: 10px; align-items: center; }
.page-indicator {
  font-family: 'Cormorant Garamond', serif;
  color: #e0c3fc;
  font-size: 14px;
  padding: 4px 14px;
  background: rgba(200, 158, 255, 0.1);
  border-radius: 20px;
  border: 1px solid rgba(200, 158, 255, 0.2);
}

/* Book Container */
.book-container {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  overflow: hidden;
  padding: 10px;
}
#book {
  position: relative;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 100px rgba(200, 158, 255, 0.15);
  border-radius: 4px;
}
.page {
  background: linear-gradient(135deg, #fdf6ff 0%, #f5e6ff 50%, #e8d5f5 100%);
  color: #3d2a5c;
  padding: 24px;
  position: relative;
  overflow: hidden;
  font-family: 'Tajawal', sans-serif;
}
.page::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(255, 180, 220, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(200, 158, 255, 0.15) 0%, transparent 40%);
  pointer-events: none;
}
.page-content {
  position: relative; z-index: 2;
  height: 100%; width: 100%;
  display: flex; flex-direction: column;
}
.page-number {
  position: absolute;
  bottom: 10px; left: 50%; transform: translateX(-50%);
  font-family: 'Cormorant Garamond', serif;
  font-size: 13px;
  color: #6b3d8a;
  opacity: 0.7;
  z-index: 5;
}

/* Page Types */
.page-cover {
  background: linear-gradient(135deg, #6b3d8a 0%, #4a2c6d 50%, #3d2a5c 100%);
  color: #f5e6ff;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
}
.page-cover::before {
  background:
    radial-gradient(circle at 50% 30%, rgba(255, 158, 199, 0.2) 0%, transparent 50%),
    repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(255,255,255,0.02) 20px, rgba(255,255,255,0.02) 21px);
}
.cover-content { position: relative; z-index: 2; padding: 20px; }
.cover-title {
  font-family: 'Great Vibes', cursive;
  font-size: 48px;
  background: linear-gradient(135deg, #ffc0e0 0%, #ff9ec7 50%, #c89eff 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 30px rgba(255, 158, 199, 0.5);
  margin-bottom: 10px;
  outline: none;
}
.cover-subtitle {
  font-family: 'Amiri', serif;
  font-size: 18px;
  color: #e0c3fc;
  margin-bottom: 30px;
  outline: none;
}
.cover-ornament {
  font-size: 50px;
  color: #ff9ec7;
  filter: drop-shadow(0 0 15px rgba(255, 158, 199, 0.6));
  margin: 20px 0;
}
.cover-date {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  color: #e0c3fc;
  letter-spacing: 3px;
  margin-top: 30px;
  outline: none;
}
.cover-border {
  position: absolute; inset: 20px;
  border: 1px solid rgba(255, 200, 230, 0.3);
  border-radius: 4px;
  pointer-events: none;
}

.page-letter {
  background: linear-gradient(135deg, #fff8fc 0%, #fce8f3 100%);
}
.letter-header {
  font-family: 'Great Vibes', cursive;
  font-size: 32px;
  color: #c85a8f;
  text-align: center;
  margin-bottom: 15px;
  outline: none;
}
.letter-date {
  text-align: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 13px;
  color: #8a5a7a;
  margin-bottom: 15px;
  letter-spacing: 2px;
  outline: none;
}
.letter-body {
  flex: 1;
  font-family: 'Amiri', serif;
  font-size: 16px;
  line-height: 1.9;
  color: #4a2c4a;
  outline: none;
  padding: 10px;
  background: repeating-linear-gradient(transparent, transparent 28px, rgba(200, 158, 255, 0.15) 28px, rgba(200, 158, 255, 0.15) 29px);
  overflow-y: auto;
}
.letter-signature {
  font-family: 'Dancing Script', cursive;
  font-size: 22px;
  color: #c85a8f;
  text-align: left;
  margin-top: 15px;
  outline: none;
}

.page-gallery {
  background: linear-gradient(135deg, #fef0f8 0%, #f0e0ff 100%);
}
.gallery-title {
  font-family: 'Great Vibes', cursive;
  font-size: 28px;
  color: #c85a8f;
  text-align: center;
  margin-bottom: 10px;
  outline: none;
}
.gallery-grid {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 5px;
  overflow: hidden;
}
.polaroid {
  background: white;
  padding: 8px 8px 28px 8px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  position: relative;
  cursor: grab;
  transition: transform 0.3s;
  display: flex; flex-direction: column;
}
.polaroid:hover { transform: scale(1.03) rotate(0deg) !important; z-index: 10; }
.polaroid-image {
  width: 100%;
  aspect-ratio: 1;
  background: linear-gradient(135deg, #fce8f3, #e8d5f5);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  position: relative;
}
.polaroid-image img { width: 100%; height: 100%; object-fit: cover; }
.polaroid-placeholder {
  font-size: 32px;
  color: #c89eff;
  opacity: 0.5;
}
.polaroid-caption {
  position: absolute;
  bottom: 5px; left: 0; right: 0;
  text-align: center;
  font-family: 'Dancing Script', cursive;
  font-size: 13px;
  color: #6b3d8a;
  outline: none;
}
.polaroid-add {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  background: rgba(200, 158, 255, 0.05);
  transition: background 0.3s;
}
.polaroid-add:hover { background: rgba(200, 158, 255, 0.15); }
.polaroid-add-icon {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff9ec7, #c89eff);
  color: white;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  box-shadow: 0 4px 15px rgba(255, 111, 168, 0.4);
}

.page-quote {
  background: linear-gradient(135deg, #f5e6ff 0%, #fce8f3 100%);
  display: flex; align-items: center; justify-content: center;
  text-align: center;
}
.quote-mark {
  font-family: 'Cormorant Garamond', serif;
  font-size: 80px;
  color: #ff9ec7;
  opacity: 0.4;
  line-height: 0.5;
  margin-bottom: 20px;
}
.quote-text {
  font-family: 'Amiri', serif;
  font-size: 20px;
  line-height: 1.8;
  color: #4a2c6d;
  font-style: italic;
  padding: 0 15px;
  outline: none;
}
.quote-author {
  font-family: 'Dancing Script', cursive;
  font-size: 18px;
  color: #c85a8f;
  margin-top: 25px;
  outline: none;
}

.page-memory {
  background: linear-gradient(135deg, #fff0f8 0%, #f5e6ff 100%);
}
.memory-title {
  font-family: 'Great Vibes', cursive;
  font-size: 30px;
  color: #c85a8f;
  text-align: center;
  margin-bottom: 15px;
  outline: none;
}
.memory-date-badge {
  display: inline-block;
  padding: 5px 18px;
  background: linear-gradient(135deg, #ff9ec7, #c89eff);
  color: white;
  border-radius: 20px;
  font-size: 13px;
  margin: 0 auto 15px;
  font-family: 'Cormorant Garamond', serif;
  letter-spacing: 1px;
  outline: none;
}
.memory-body {
  flex: 1;
  font-family: 'Tajawal', sans-serif;
  font-size: 15px;
  line-height: 1.9;
  color: #4a2c4a;
  outline: none;
  padding: 10px;
  overflow-y: auto;
}

.page-audio {
  background: linear-gradient(135deg, #f0e0ff 0%, #fce8f3 100%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.audio-title {
  font-family: 'Great Vibes', cursive;
  font-size: 28px;
  color: #c85a8f;
  margin-bottom: 20px;
  outline: none;
}
.audio-artwork {
  width: 140px; height: 140px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff9ec7 0%, #c89eff 50%, #6b3d8a 100%);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 40px rgba(255, 111, 168, 0.4);
  position: relative;
  margin-bottom: 20px;
  cursor: pointer;
  transition: transform 0.3s;
}
.audio-artwork.playing { animation: rotate 8s linear infinite; }
@keyframes rotate { to { transform: rotate(360deg); } }
.audio-artwork::before {
  content: ''; position: absolute;
  width: 30px; height: 30px;
  background: #1a0f2e;
  border-radius: 50%;
  border: 3px solid #2a1b3d;
}
.audio-artwork-icon {
  font-size: 50px;
  color: rgba(255,255,255,0.9);
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
}
.audio-waveform {
  width: 90%;
  height: 60px;
  display: flex; align-items: center; justify-content: center;
  gap: 3px;
  margin-bottom: 15px;
}
.wave-bar {
  width: 4px;
  background: linear-gradient(180deg, #ff9ec7, #c89eff);
  border-radius: 2px;
  height: 10px;
  transition: height 0.15s;
}
.audio-controls {
  display: flex; align-items: center; gap: 15px;
  margin-bottom: 15px;
}
.audio-btn {
  width: 50px; height: 50px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff6fa8, #c89eff);
  border: none;
  color: white;
  font-size: 18px;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(255, 111, 168, 0.4);
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.2s;
}
.audio-btn:active { transform: scale(0.92); }
.audio-progress {
  width: 85%;
  height: 6px;
  background: rgba(200, 158, 255, 0.2);
  border-radius: 3px;
  position: relative;
  cursor: pointer;
  margin-bottom: 10px;
}
.audio-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #ff9ec7, #c89eff);
  border-radius: 3px;
  width: 0%;
  transition: width 0.1s linear;
}
.audio-time {
  font-family: 'Cormorant Garamond', serif;
  font-size: 13px;
  color: #6b3d8a;
  letter-spacing: 1px;
}
.audio-upload {
  margin-top: 15px;
  padding: 10px 24px;
  background: rgba(200, 158, 255, 0.15);
  border: 1px dashed rgba(200, 158, 255, 0.4);
  border-radius: 25px;
  color: #6b3d8a;
  font-family: 'Tajawal', sans-serif;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.3s;
}
.audio-upload:hover { background: rgba(200, 158, 255, 0.25); }

.page-dates {
  background: linear-gradient(135deg, #fce8f3 0%, #f0e0ff 100%);
}
.dates-title {
  font-family: 'Great Vibes', cursive;
  font-size: 28px;
  color: #c85a8f;
  text-align: center;
  margin-bottom: 15px;
  outline: none;
}
.date-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px;
  background: rgba(255,255,255,0.6);
  border-radius: 12px;
  margin-bottom: 10px;
  border-right: 3px solid #ff9ec7;
  box-shadow: 0 2px 10px rgba(200, 158, 255, 0.1);
}
.date-icon {
  width: 45px; height: 45px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff9ec7, #c89eff);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.date-info { flex: 1; }
.date-name {
  font-family: 'Amiri', serif;
  font-size: 16px;
  color: #4a2c6d;
  font-weight: 700;
  outline: none;
}
.date-value {
  font-family: 'Cormorant Garamond', serif;
  font-size: 13px;
  color: #8a5a7a;
  margin-top: 2px;
  outline: none;
}

.page-social {
  background: linear-gradient(135deg, #fef0f8 0%, #f5e6ff 100%);
}
.social-title {
  font-family: 'Great Vibes', cursive;
  font-size: 28px;
  color: #c85a8f;
  text-align: center;
  margin-bottom: 15px;
  outline: none;
}
.social-post {
  background: rgba(255,255,255,0.7);
  border-radius: 15px;
  padding: 15px;
  margin-bottom: 12px;
  box-shadow: 0 4px 15px rgba(200, 158, 255, 0.15);
  border: 1px solid rgba(255, 158, 199, 0.2);
}
.social-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 10px;
}
.social-avatar {
  width: 35px; height: 35px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff9ec7, #c89eff);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.social-user {
  font-family: 'Tajawal', sans-serif;
  font-size: 14px;
  color: #4a2c6d;
  font-weight: 700;
  outline: none;
}
.social-time {
  font-size: 11px;
  color: #8a5a7a;
  outline: none;
}
.social-text {
  font-family: 'Amiri', serif;
  font-size: 15px;
  line-height: 1.7;
  color: #4a2c4a;
  outline: none;
}

/* ========== BOTTOM TOOLBAR ========== */
.toolbar {
  height: 60px;
  background: linear-gradient(0deg, rgba(26, 15, 46, 0.95) 0%, rgba(26, 15, 46, 0.7) 100%);
  backdrop-filter: blur(10px);
  border-top: 1px solid rgba(200, 158, 255, 0.15);
  display: flex; align-items: center; justify-content: space-around;
  padding: 0 10px;
  flex-shrink: 0;
  z-index: 20;
}
.tool-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px;
  padding: 8px 12px;
  background: transparent;
  border: none;
  color: #e0c3fc;
  cursor: pointer;
  border-radius: 12px;
  transition: all 0.3s;
  font-family: 'Tajawal', sans-serif;
  font-size: 10px;
  min-width: 55px;
}
.tool-btn:hover { background: rgba(200, 158, 255, 0.1); color: #ff9ec7; }
.tool-btn .icon { font-size: 20px; }

/* ========== MODAL ========== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(26, 15, 46, 0.85);
  backdrop-filter: blur(8px);
  z-index: 100;
  display: none;
  align-items: center; justify-content: center;
  padding: 20px;
  animation: fadeIn 0.3s;
}
.modal-overlay.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: linear-gradient(135deg, #3d2a5c 0%, #2a1b3d 100%);
  border: 1px solid rgba(200, 158, 255, 0.3);
  border-radius: 20px;
  padding: 25px;
  max-width: 400px; width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  animation: modalSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes modalSlide { from { transform: translateY(30px) scale(0.95); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
.modal-title {
  font-family: 'Great Vibes', cursive;
  font-size: 32px;
  background: linear-gradient(135deg, #ffc0e0, #c89eff);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  text-align: center;
  margin-bottom: 20px;
}
.modal-close {
  position: absolute; top: 15px; left: 15px;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  border: none;
  color: #e0c3fc;
  cursor: pointer;
  font-size: 16px;
}
.page-type-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.page-type-btn {
  padding: 18px 10px;
  background: rgba(200, 158, 255, 0.1);
  border: 1px solid rgba(200, 158, 255, 0.2);
  border-radius: 15px;
  color: #e0c3fc;
  cursor: pointer;
  transition: all 0.3s;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  font-family: 'Tajawal', sans-serif;
  font-size: 13px;
}
.page-type-btn:hover {
  background: rgba(255, 111, 168, 0.2);
  border-color: #ff9ec7;
  transform: translateY(-3px);
}
.page-type-btn .icon { font-size: 28px; }

/* Sticker Picker */
.sticker-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
}
.sticker-btn {
  aspect-ratio: 1;
  background: rgba(200, 158, 255, 0.1);
  border: 1px solid rgba(200, 158, 255, 0.2);
  border-radius: 10px;
  font-size: 24px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.sticker-btn:hover { background: rgba(255, 111, 168, 0.2); transform: scale(1.1); }

/* Color Picker */
.color-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}
.color-btn {
  aspect-ratio: 1;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.2);
  cursor: pointer;
  transition: transform 0.2s;
}
.color-btn:hover { transform: scale(1.1); }

/* ========== VIRTUAL KEYBOARD ========== */
#keyboard {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(180deg, #2a1b3d 0%, #1a0f2e 100%);
  border-top: 1px solid rgba(200, 158, 255, 0.2);
  padding: 8px 6px 12px;
  z-index: 50;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
}
#keyboard.active { transform: translateY(0); }
.keyboard-row {
  display: flex; justify-content: center;
  gap: 4px;
  margin-bottom: 4px;
}
.key {
  flex: 1;
  max-width: 34px;
  height: 40px;
  background: linear-gradient(180deg, #4a2c6d 0%, #3d2a5c 100%);
  border: 1px solid rgba(200, 158, 255, 0.15);
  border-radius: 8px;
  color: #f5e6ff;
  font-family: 'Tajawal', sans-serif;
  font-size: 15px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.1s;
  box-shadow: 0 2px 0 rgba(0,0,0,0.3);
}
.key:active { transform: translateY(2px); box-shadow: 0 0 0 rgba(0,0,0,0.3); background: #ff9ec7; color: #1a0f2e; }
.key.space { flex: 6; max-width: none; }
.key.special { background: linear-gradient(180deg, #6b3d8a 0%, #4a2c6d 100%); font-size: 13px; }
.key.accent { background: linear-gradient(135deg, #ff6fa8, #c89eff); color: white; }

/* ========== MINI PLAYER ========== */
#miniPlayer {
  position: fixed;
  bottom: 70px; left: 10px; right: 10px;
  background: linear-gradient(135deg, rgba(61, 42, 92, 0.95), rgba(42, 27, 61, 0.95));
  backdrop-filter: blur(15px);
  border: 1px solid rgba(200, 158, 255, 0.3);
  border-radius: 16px;
  padding: 10px 14px;
  display: none;
  align-items: center;
  gap: 12px;
  z-index: 30;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
#miniPlayer.active { display: flex; }
@keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.mini-artwork {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff9ec7, #c89eff);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.mini-artwork.playing { animation: rotate 4s linear infinite; }
.mini-info { flex: 1; min-width: 0; }
.mini-title {
  font-family: 'Tajawal', sans-serif;
  font-size: 13px;
  color: #f5e6ff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mini-progress {
  height: 3px;
  background: rgba(200, 158, 255, 0.2);
  border-radius: 2px;
  margin-top: 4px;
  overflow: hidden;
}
.mini-progress-fill { height: 100%; background: linear-gradient(90deg, #ff9ec7, #c89eff); width: 0%; }
.mini-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff6fa8, #c89eff);
  border: none;
  color: white;
  font-size: 14px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

/* ========== STICKERS ON PAGE ========== */
.page-sticker {
  position: absolute;
  font-size: 30px;
  cursor: move;
  z-index: 10;
  user-select: none;
  filter: drop-shadow(0 2px 5px rgba(0,0,0,0.2));
  transition: transform 0.1s;
}
.page-sticker:hover { transform: scale(1.15); }
.sticker-delete {
  position: absolute;
  top: -10px; right: -10px;
  width: 20px; height: 20px;
  background: #ff4757;
  color: white;
  border-radius: 50%;
  display: none;
  align-items: center; justify-content: center;
  font-size: 12px;
  cursor: pointer;
}
.page-sticker:hover .sticker-delete { display: flex; }

/* ========== NAV ARROWS ========== */
.nav-arrow {
  position: absolute;
  top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px;
  background: rgba(255, 111, 168, 0.3);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 158, 199, 0.4);
  border-radius: 50%;
  color: white;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 15;
  font-size: 18px;
  transition: all 0.3s;
  box-shadow: 0 4px 20px rgba(255, 111, 168, 0.3);
}
.nav-arrow:hover { background: rgba(255, 111, 168, 0.5); transform: translateY(-50%) scale(1.1); }
.nav-arrow.prev { right: 10px; }
.nav-arrow.next { left: 10px; }
[dir="rtl"] .nav-arrow.prev { right: auto; left: 10px; }
[dir="rtl"] .nav-arrow.next { left: auto; right: 10px; }

/* ========== SCROLLBAR ========== */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(200, 158, 255, 0.3); border-radius: 2px; }

/* ========== RESPONSIVE ========== */
@media (max-width: 480px) {
  .welcome-title { font-size: 40px; }
  .welcome-subtitle { font-size: 16px; }
  .welcome-book { width: 140px; height: 180px; }
  .welcome-book .heart { font-size: 45px; }
  .topbar-title { font-size: 22px; }
  .cover-title { font-size: 36px; }
  .letter-header, .gallery-title, .memory-title, .audio-title, .dates-title, .social-title, .quote-text { font-size: 22px; }
  .quote-text { font-size: 16px; }
  .letter-body, .memory-body { font-size: 14px; }
  .nav-arrow { width: 38px; height: 38px; }
  .key { height: 38px; font-size: 14px; }
}

@media (min-width: 768px) {
  .welcome-title { font-size: 64px; }
  .cover-title { font-size: 56px; }
}

/* ========== TOAST ========== */
.toast {
  position: fixed;
  bottom: 140px; left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #ff6fa8, #c89eff);
  color: white;
  padding: 10px 24px;
  border-radius: 25px;
  font-family: 'Tajawal', sans-serif;
  font-size: 14px;
  box-shadow: 0 10px 30px rgba(255, 111, 168, 0.4);
  z-index: 200;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }

/* Editable focus */
[contenteditable="true"]:focus {
  outline: 2px dashed rgba(255, 111, 168, 0.4);
  outline-offset: 3px;
  border-radius: 4px;
}
</style>
</head>
<body>

<!-- Background Particles -->
<div class="bg-particles" id="bgParticles"></div>

<!-- Welcome Screen -->
<div id="welcome">
  <div class="welcome-book">
    <div class="heart">💖</div>
  </div>
  <h1 class="welcome-title">Memory Diary</h1>
  <p class="welcome-subtitle">دفتر الذكريات</p>
  <button class="welcome-btn" onclick="openDiary()">✨ Open Diary ✨</button>
</div>

<!-- Loading -->
<div id="loading">
  <div class="loader"></div>
  <p class="loader-text">جاري فتح الذكريات...</p>
</div>

<!-- Main App -->
<div id="app">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-left">
      <button class="topbar-btn" onclick="showToast('💖 ذكرياتك محفوظة')" title="حفظ">💾</button>
      <button class="topbar-btn" onclick="exportDiary()" title="تصدير">📤</button>
    </div>
    <div class="topbar-title">Memory Diary</div>
    <div class="topbar-right">
      <span class="page-indicator" id="pageIndicator">1 / 1</span>
      <button class="topbar-btn" onclick="toggleLang()" title="اللغة">🌐</button>
    </div>
  </div>

  <!-- Book Container -->
  <div class="book-container">
    <div class="nav-arrow prev" onclick="flipPrev()">❮</div>
    <div id="book"></div>
    <div class="nav-arrow next" onclick="flipNext()">❯</div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <button class="tool-btn" onclick="showAddPageModal()">
      <span class="icon">📄</span><span>إضافة</span>
    </button>
    <button class="tool-btn" onclick="showStickerModal()">
      <span class="icon">✨</span><span>ملصقات</span>
    </button>
    <button class="tool-btn" onclick="showColorModal()">
      <span class="icon">🎨</span><span>ألوان</span>
    </button>
    <button class="tool-btn" onclick="deleteCurrentPage()">
      <span class="icon">🗑️</span><span>حذف</span>
    </button>
    <button class="tool-btn" onclick="showKeyboard()">
      <span class="icon">⌨️</span><span>كتابة</span>
    </button>
  </div>
</div>

<!-- Mini Player -->
<div id="miniPlayer">
  <div class="mini-artwork" id="miniArtwork">🎵</div>
  <div class="mini-info">
    <div class="mini-title" id="miniTitle">لا يوجد صوت</div>
    <div class="mini-progress"><div class="mini-progress-fill" id="miniProgress"></div></div>
  </div>
  <button class="mini-btn" id="miniPlayBtn" onclick="toggleMiniPlayer()">▶</button>
</div>

<!-- Virtual Keyboard -->
<div id="keyboard"></div>

<!-- Modals -->
<div class="modal-overlay" id="addPageModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('addPageModal')">✕</button>
    <h2 class="modal-title">Add a Page</h2>
    <div class="page-type-grid">
      <button class="page-type-btn" onclick="addPage('letter')"><span class="icon">💌</span><span>رسالة</span></button>
      <button class="page-type-btn" onclick="addPage('gallery')"><span class="icon">📸</span><span>صور</span></button>
      <button class="page-type-btn" onclick="addPage('quote')"><span class="icon">💭</span><span>اقتباس</span></button>
      <button class="page-type-btn" onclick="addPage('memory')"><span class="icon">📖</span><span>ذكرى</span></button>
      <button class="page-type-btn" onclick="addPage('audio')"><span class="icon">🎵</span><span>صوت</span></button>
      <button class="page-type-btn" onclick="addPage('dates')"><span class="icon">📅</span><span>تواريخ</span></button>
      <button class="page-type-btn" onclick="addPage('social')"><span class="icon">💬</span><span>منشور</span></button>
      <button class="page-type-btn" onclick="addPage('love')"><span class="icon">💕</span><span>حب</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="stickerModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('stickerModal')">✕</button>
    <h2 class="modal-title">Stickers</h2>
    <div class="sticker-grid" id="stickerGrid"></div>
  </div>
</div>

<div class="modal-overlay" id="colorModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('colorModal')">✕</button>
    <h2 class="modal-title">Background</h2>
    <div class="color-grid" id="colorGrid"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   DIGITAL DIARY - Complete Application
   ============================================================ */

// ===== STATE =====
const STORAGE_KEY = 'memory_diary_v1';
let state = {
  pages: [],
  currentPage: 0,
  lang: 'ar',
  theme: 'default'
};

let pageFlip = null;
let currentAudio = null;
let currentAudioPageId = null;
let activeEditable = null;
let isKeyboardOpen = false;
let keyboardLang = 'ar';

// ===== STICKERS & COLORS =====
const STICKERS = ['💖','💕','💗','💝','✨','⭐','🌟','💫','🌸','🌹','🌺','🌷','🦋','🎀','🎈','🎁','🕊️','🌙','☀️','🌈','💐','🍃','🌿','🔮','👑','💎','🎵','🎶','📸','💌','📝','🌻','🍀','🎭','🎪','🧸'];
const COLORS = [
  {name:'default', bg:'linear-gradient(135deg, #fdf6ff 0%, #f5e6ff 50%, #e8d5f5 100%)'},
  {name:'rose', bg:'linear-gradient(135deg, #fff0f5 0%, #fce4ec 100%)'},
  {name:'lavender', bg:'linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%)'},
  {name:'mint', bg:'linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%)'},
  {name:'peach', bg:'linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%)'},
  {name:'sky', bg:'linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%)'},
  {name:'cream', bg:'linear-gradient(135deg, #fffde7 0%, #fff9c4 100%)'},
  {name:'blush', bg:'linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%)'},
  {name:'sage', bg:'linear-gradient(135deg, #f1f8e9 0%, #dcedc8 100%)'},
  {name:'lilac', bg:'linear-gradient(135deg, #ede7f6 0%, #d1c4e9 100%)'}
];

// ===== INITIALIZATION =====
window.addEventListener('load', () => {
  createParticles();
  buildKeyboard();
  buildStickerGrid();
  buildColorGrid();
  loadState();
  if (state.pages.length === 0) {
    createDefaultPages();
  }
});

function createParticles() {
  const container = document.getElementById('bgParticles');
  const symbols = ['💖','✨','⭐','💫','🌸','💕'];
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (15 + Math.random() * 20) + 's';
    p.style.animationDelay = Math.random() * 20 + 's';
    p.style.fontSize = (10 + Math.random() * 14) + 'px';
    container.appendChild(p);
  }
}

// ===== WELCOME & LOADING =====
function openDiary() {
  const welcome = document.getElementById('welcome');
  const loading = document.getElementById('loading');
  welcome.classList.add('hidden');
  setTimeout(() => {
    welcome.style.display = 'none';
    loading.style.display = 'flex';
    setTimeout(() => {
      initBook();
      loading.style.display = 'none';
    }, 800);
  }, 600);
}

// ===== PAGE TEMPLATES =====
function createPageHTML(type, data = {}) {
  const id = 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
  const base = { id, type, stickers: [], bg: 'default', ...data };

  switch(type) {
    case 'cover':
      return { ...base, html: `
        <div class="page page-cover">
          <div class="cover-border"></div>
          <div class="cover-content page-content">
            <div class="cover-ornament">💖</div>
            <div class="cover-title" contenteditable="true" data-field="title">${data.title || 'My Memories'}</div>
            <div class="cover-subtitle" contenteditable="true" data-field="subtitle">${data.subtitle || 'ذكريات من القلب'}</div>
            <div class="cover-ornament">✨</div>
            <div class="cover-date" contenteditable="true" data-field="date">${data.date || new Date().toLocaleDateString('en-GB')}</div>
          </div>
          <div class="page-number"></div>
        </div>` };

    case 'letter':
      return { ...base, html: `
        <div class="page page-letter">
          <div class="page-content">
            <div class="letter-header" contenteditable="true" data-field="header">${data.header || 'رسالة من القلب'}</div>
            <div class="letter-date" contenteditable="true" data-field="date">${data.date || new Date().toLocaleDateString('ar-EG')}</div>
            <div class="letter-body" contenteditable="true" data-field="body">${data.body || 'اكتب رسالتك هنا... كل كلمة تحمل ذكرى، وكل سطر يحكي قصة.'}</div>
            <div class="letter-signature" contenteditable="true" data-field="signature">${data.signature || 'مع حبي 💕'}</div>
          </div>
          <div class="page-number"></div>
        </div>` };

    case 'gallery':
      const photos = data.photos || [{},{},{},{}];
      const photoHTML = photos.map((p, i) => `
        <div class="polaroid" style="transform: rotate(${(Math.random()*6-3).toFixed(1)}deg)" data-index="${i}">
          <div class="polaroid-image">
            ${p.src ? `<img src="${p.src}" alt="">` : `
              <div class="polaroid-add" onclick="uploadPhoto(this, ${i})">
                <div class="polaroid-add-icon">+</div>
              </div>`}
          </div>
          <div class="polaroid-caption" contenteditable="true" data-field="caption_${i}">${p.caption || ''}</div>
        </div>
      `).join('');
      return { ...base, html: `
        <div class="page page-gallery">
          <div class="page-content">
            <div class="gallery-title" contenteditable="true" data-field="title">${data.title || 'لحظات جميلة'}</div>
            <div class="gallery-grid">${photoHTML}</div>
          </div>
          <div class="page-number"></div>
        </div>` };

    case 'quote':
      return { ...base, html: `
        <div class="page page-quote">
          <div class="page-content" style="justify-content:center; align-items:center;">
            <div class="quote-mark">"</div>
            <div class="quote-text" contenteditable="true" data-field="text">${data.text || 'الحب هو أن تجد في شخص آخر العالم الذي كنت تبحث عنه دائماً'}</div>
            <div class="quote-author" contenteditable="true" data-field="author">${data.author || '— من القلب'}</div>
          </div>
          <div class="page-number"></div>
        </div>` };

    case 'memory':
      return { ...base, html: `
        <div class="page page-memory">
          <div class="page-content">
            <div class="memory-title" contenteditable="true" data-field="title">${data.title || 'ذكرى لا تُنسى'}</div>
            <div style="text-align:center"><span class="memory-date-badge" contenteditable="true" data-field="date">${data.date || new Date().toLocaleDateString('ar-EG')}</span></div>
            <div class="memory-body" contenteditable="true" data-field="body">${data.body || 'هناك لحظات في الحياة تبقى محفورة في الذاكرة إلى الأبد... اكتبذكرىك هنا.'}</div>
          </div>
          <div class="page-number"></div>
        </div>` };

    case 'audio':
      return { ...base, html: `
        <div class="page page-audio">
          <div class="page-content">
            <div class="audio-title" contenteditable="true" data-field="title">${data.title || 'أغنيتنا'}</div>
            <div class="audio-artwork" id="artwork_${id}" onclick="toggleAudio('${id}')">
              <div class="audio-artwork-icon">🎵</div>
            </div>
            <div class="audio-waveform" id="waveform_${id}"></div>
            <div class="audio-controls">
              <button class="audio-btn" onclick="toggleAudio('${id}')">▶</button>
            </div>
            <div class="audio-progress" onclick="seekAudio(event, '${id}')">
              <div class="audio-progress-fill" id="progress_${id}"></div>
            </div>
            <div class="audio-time" id="time_${id}">0:00 / 0:00</div>
            <label class="audio-upload">
              📁 رفع ملف صوتي
              <input type="file" accept="audio/*" style="display:none" onchange="uploadAudio(event, '${id}')">
            </label>
          </div>
          <div class="page-number"></div>
        </div>` };

    case 'dates':
      const dates = data.dates || [
        {icon:'💕', name:'ذكرى جميلة', value:''},
        {icon:'🎂', name:'عيد ميلاد', value:''},
        {icon:'🌹', name:'مناسبة خاصة', value:''}
      ];
      const datesHTML = dates.map((d, i) => `
        <div class="date-item">
          <div class="date-icon">${d.icon}</div>
          <div class="date-info">

// ===== BOOK INITIALIZATION =====
function initBook() {
  const bookEl = document.getElementById('book');
  bookEl.innerHTML = '';

  // Calculate book size based on viewport
  const vw = window.innerWidth;
  const vh = window.innerHeight - 110; // minus topbar + toolbar
  let width, height;

  if (vw < 600) {
    // Mobile: single page view
    width = Math.min(vw - 30, 360);
    height = Math.min(vh - 20, 500);
  } else {
    // Desktop: two-page spread
    width = Math.min(vw - 80, 800);
    height = Math.min(vh - 40, 560);
  }

  // Create pages
  state.pages.forEach((page, i) => {
    const div = document.createElement('div');
    div.className = 'page-wrapper';
    div.setAttribute('data-page-index', i);
    div.innerHTML = page.html;
    if (page.bg && page.bg !== 'default') {
      const pageEl = div.querySelector('.page');
      if (pageEl) {
        const colorObj = COLORS.find(c => c.name === page.bg);
        if (colorObj) pageEl.style.background = colorObj.bg;
      }
    }
    bookEl.appendChild(div);
  });

  // Init PageFlip
  if (pageFlip) {
    try { pageFlip.destroy(); } catch(e) {}
  }

  const isMobile = vw < 600;
  pageFlip = new St.PageFlip(bookEl, {
    width: isMobile ? width : width / 2,
    height: height,
    size: isMobile ? 'stretch' : 'fixed',
    minWidth: 200,
    maxWidth: 500,
    minHeight: 300,
    maxHeight: 700,
    showCover: true,
    maxShadowOpacity: 0.5,
    mobileScrollSupport: false,
    swipeDistance: 30,
    clickEventForward: true,
    useMouseEvents: true,
    flippingTime: 800,
    usePortrait: isMobile,
    drawShadow: true,
    autoSize: true,
    startPage: 0
  });

  pageFlip.loadFromHTML(document.querySelectorAll('.page-wrapper'));

  // Events
  pageFlip.on('flip', (e) => {
    state.currentPage = e.data;
    updatePageIndicator();
    saveState();
  });

  updatePageIndicator();

  // Restore audio if any
  setTimeout(() => {
    state.pages.forEach(p => {
      if (p.audioSrc) {
        setupAudioForPage(p.id, p.audioSrc);
      }
    });
    // Restore stickers
    state.pages.forEach(p => {
      if (p.stickers && p.stickers.length) {
        p.stickers.forEach(s => addStickerToPage(p.id, s));
      }
    });
  }, 500);
}

function updatePageIndicator() {
  const total = state.pages.length;
  const current = (state.currentPage || 0) + 1;
  document.getElementById('pageIndicator').textContent = `${current} / ${total}`;
}

function flipNext() {
  if (pageFlip) pageFlip.flipNext();
}
function flipPrev() {
  if (pageFlip) pageFlip.flipPrev();
}

// ===== PHOTO UPLOAD =====
function uploadPhoto(el, index) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      // Compress image
      compressImage(ev.target.result, 600, (compressed) => {
        const pageIdx = getCurrentPageIndex();
        if (state.pages[pageIdx]) {
          if (!state.pages[pageIdx].photos) state.pages[pageIdx].photos = [{},{},{},{}];
          state.pages[pageIdx].photos[index] = { src: compressed, caption: '' };
          saveState();
          // Update DOM
          const imgContainer = el.parentElement;
          imgContainer.innerHTML = `<img src="${compressed}" alt="">`;
          showToast('📸 تمت إضافة الصورة');
        }
      });
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function compressImage(dataUrl, maxSize, callback) {
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    let w = img.width, h = img.height;
    if (w > h) {
      if (w > maxSize) { h = h * maxSize / w; w = maxSize; }
    } else {
      if (h > maxSize) { w = w * maxSize / h; h = maxSize; }
    }
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    callback(canvas.toDataURL('image/jpeg', 0.75));
  };
  img.src = dataUrl;
}

function getCurrentPageIndex() {
  return state.currentPage;
}

// ===== AUDIO =====
function uploadAudio(event, pageId) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const page = state.pages.find(p => p.id === pageId);
    if (page) {
      page.audioSrc = e.target.result;
      saveState();
      setupAudioForPage(pageId, e.target.result);
      showToast('🎵 تم رفع الصوت');
    }
  };
  reader.readAsDataURL(file);
}

function setupAudioForPage(pageId, src) {
  const audio = new Audio(src);
  const waveform = document.getElementById('waveform_' + pageId);
  const progress = document.getElementById('progress_' + pageId);
  const time = document.getElementById('time_' + pageId);
  const artwork = document.getElementById('artwork_' + pageId);
  if (!waveform) return;

  // Build waveform bars
  if (waveform.children.length === 0) {
    for (let i = 0; i < 40; i++) {
      const bar = document.createElement('div');
      bar.className = 'wave-bar';
      waveform.appendChild(bar);
    }
  }

  audio.addEventListener('loadedmetadata', () => {
    time.textContent = `0:00 / ${formatTime(audio.duration)}`;
  });

  audio.addEventListener('timeupdate', () => {
    const pct = (audio.currentTime / audio.duration) * 100;
    progress.style.width = pct + '%';
    time.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
    // Update mini player
    if (currentAudioPageId === pageId) {
      document.getElementById('miniProgress').style.width = pct + '%';
    }
    // Animate waveform
    animateWaveform(waveform, audio.currentTime);
  });

  audio.addEventListener('ended', () => {
    if (artwork) artwork.classList.remove('playing');
    const btn = artwork?.parentElement?.querySelector('.audio-btn');
    if (btn) btn.textContent = '▶';
    if (currentAudioPageId === pageId) {
      document.getElementById('miniPlayBtn').textContent = '▶';
      document.getElementById('miniArtwork').classList.remove('playing');
    }
  });

  // Store reference
  if (!window.pageAudios) window.pageAudios = {};
  window.pageAudios[pageId] = audio;
}

function animateWaveform(waveform, time) {
  const bars = waveform.children;
  for (let i = 0; i < bars.length; i++) {
    const h = 10 + Math.abs(Math.sin(time * 3 + i * 0.3)) * 40;
    bars[i].style.height = h + 'px';
  }
}

function toggleAudio(pageId) {
  const audio = window.pageAudios?.[pageId];
  if (!audio) {
    showToast('⚠️ ارفع ملف صوتي أولاً');
    return;
  }
  // Stop other audio
  if (currentAudioPageId && currentAudioPageId !== pageId && window.pageAudios[currentAudioPageId]) {
    window.pageAudios[currentAudioPageId].pause();
    const oldArtwork = document.getElementById('artwork_' + currentAudioPageId);
    if (oldArtwork) oldArtwork.classList.remove('playing');
  }

  const artwork = document.getElementById('artwork_' + pageId);
  const btn = artwork?.parentElement?.querySelector('.audio-btn');

  if (audio.paused) {
    audio.play();
    currentAudioPageId = pageId;
    currentAudio = audio;
    if (artwork) artwork.classList.add('playing');
    if (btn) btn.textContent = '⏸';
    // Show mini player
    showMiniPlayer(pageId);
  } else {
    audio.pause();
    if (artwork) artwork.classList.remove('playing');
    if (btn) btn.textContent = '▶';
    document.getElementById('miniPlayBtn').textContent = '▶';
    document.getElementById('miniArtwork').classList.remove('playing');
  }
}

function seekAudio(event, pageId) {
  const audio = window.pageAudios?.[pageId];
  if (!audio || !audio.duration) return;
  const rect = event.currentTarget.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const pct = x / rect.width;
  audio.currentTime = audio.duration * pct;
}

function showMiniPlayer(pageId) {
  const page = state.pages.find(p => p.id === pageId);
  if (!page) return;
  const mp = document.getElementById('miniPlayer');
  document.getElementById('miniTitle').textContent = page.title || 'صوت';
  mp.classList.add('active');
  document.getElementById('miniPlayBtn').textContent = '⏸';
  document.getElementById('miniArtwork').classList.add('playing');
}

function toggleMiniPlayer() {
  if (!currentAudio) return;
  if (currentAudio.paused) {
    currentAudio.play();
    document.getElementById('miniPlayBtn').textContent = '⏸';
    document.getElementById('miniArtwork').classList.add('playing');
    const artwork = document.getElementById('artwork_' + currentAudioPageId);
    if (artwork) artwork.classList.add('playing');
  } else {
    currentAudio.pause();
    document.getElementById('miniPlayBtn').textContent = '▶';
    document.getElementById('miniArtwork').classList.remove('playing');
    const artwork = document.getElementById('artwork_' + currentAudioPageId);
    if (artwork) artwork.classList.remove('playing');
  }
}

function formatTime(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

function addSticker(emoji) {

    emoji,

    rotation: Math.random() * 30 - 15
  };

function addStickerToPage(pageId, sticker) {
  const pageWrapper = document.querySelector(`[data-page-index="${state.pages.findIndex(p=>p.id===pageId)}"]`);
  if (!pageWrapper) return;
  const pageEl = pageWrapper.querySelector('.page');
  if (!pageEl) return;

  const el = document.createElement('div');
  el.className = 'page-sticker';
  el.textContent = sticker.emoji;
  el.style.left = sticker.x + '%';
  el.style.top = sticker.y + '%';
  el.style.transform = `rotate(${sticker.rotation}deg)`;
  el.dataset.stickerId = sticker.id;

  // Delete button
  const del = document.createElement('div');
  del.className = 'sticker-delete';
  del.textContent = '✕';
  del.onclick = (e) => {
    e.stopPropagation();
    el.remove();
    const page = state.pages.find(p => p.id === pageId);
    if (page) {
      page.stickers = page.stickers.filter(s => s.id !== sticker.id);
      saveState();
    }
  };
  el.appendChild(del);

  // Drag
  makeDraggable(el, pageEl, sticker, pageId);
  pageEl.appendChild(el);
}

function makeDraggable(el, container, sticker, pageId) {
  let isDragging = false;
  let startX, startY, origX, origY;

  const onStart = (e) => {
    if (e.target.classList.contains('sticker-delete')) return;
    isDragging = true;
    const touch = e.touches ? e.touches[0] : e;
    startX = touch.clientX;
    startY = touch.clientY;
    origX = parseFloat(el.style.left);
    origY = parseFloat(el.style.top);
    e.preventDefault();
  };

  const onMove = (e) => {
    if (!isDragging) return;
    const touch = e.touches ? e.touches[0] : e;
    const dx = touch.clientX - startX;
    const dy = touch.clientY - startY;
    const containerRect = container.getBoundingClientRect();
    const newX = origX + (dx / containerRect.width) * 100;
    const newY = origY + (dy / containerRect.height) * 100;
    el.style.left = Math.max(0, Math.min(90, newX)) + '%';
    el.style.top = Math.max(0, Math.min(90, newY)) + '%';
  };

  const onEnd = () => {
    if (!isDragging) return;
    isDragging = false;
    sticker.x = parseFloat(el.style.left);
    sticker.y = parseFloat(el.style.top);
    saveState();
  };

  el.addEventListener('mousedown', onStart);
  el.addEventListener('touchstart', onStart, { passive: false });
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('mouseup', onEnd);
  document.addEventListener('touchend', onEnd);
}

// ===== VIRTUAL KEYBOARD =====
const AR_LAYOUT = [
  ['ض','ص','ث','ق','ف','غ','ع','ه','خ','ح','ج','د'],
  ['ش','س','ي','ب','ل','ا','ت','ن','م','ك','ط'],
  ['SHIFT','ئ','ء','ؤ','ر','لا','ى','ة','و','ز','ظ','BACK'],
  ['123','SPACE','ENTER']
];
const EN_LAYOUT = [
  ['q','w','e','r','t','y','u','i','o','p'],
  ['a','s','d','f','g','h','j','k','l'],
  ['SHIFT','z','x','c','v','b','n','m','BACK'],
  ['123','SPACE','ENTER']
];
const NUM_LAYOUT = [
  ['1','2','3','4','5','6','7','8','9','0'],
  ['@','#','$','%','&','-','+','(',')'],
  ['SYM','.',',','?','!','\'','BACK'],
  ['ABC','SPACE','ENTER']
];

let currentLayout = 'ar';
let isShift = false;

function buildKeyboard() {
  renderKeyboard();
}

function renderKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  let layout;
  if (currentLayout === 'ar') layout = AR_LAYOUT;
  else if (currentLayout === 'en') layout = EN_LAYOUT;
  else layout = NUM_LAYOUT;

  layout.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'keyboard-row';
    row.forEach(key => {
      const btn = document.createElement('button');
      btn.className = 'key';
      if (key === 'SPACE') {
        btn.classList.add('space');
        btn.textContent = 'مسافة';
        btn.onclick = () => insertChar(' ');
      } else if (key === 'ENTER') {
        btn.classList.add('accent');
        btn.textContent = '↵';
        btn.onclick = () => insertChar('\n');
      } else if (key === 'BACK') {
        btn.classList.add('special');
        btn.textContent = '⌫';
        btn.onclick = deleteChar;
      } else if (key === 'SHIFT') {
        btn.classList.add('special');
        btn.textContent = '⇧';
        btn.onclick = () => { isShift = !isShift; renderKeyboard(); };
      } else if (key === '123') {
        btn.classList.add('special');
        btn.textContent = '123';
        btn.onclick = () => { currentLayout = 'num'; renderKeyboard(); };
      } else if (key === 'ABC') {
        btn.classList.add('special');
        btn.textContent = 'ABC';
        btn.onclick = () => { currentLayout = 'en'; renderKeyboard(); };
      } else if (key === 'SYM') {
        btn.classList.add('special');
        btn.textContent = '#+=';
        btn.onclick = () => { currentLayout = 'num'; renderKeyboard(); };
      } else {
        let char = key;
        if (isShift && /[a-z]/.test(char)) char = char.toUpperCase();
        btn.textContent = char;
        btn.onclick = () => {
          insertChar(char);
          if (isShift) { isShift = false; renderKeyboard(); }
        };
      }
      rowEl.appendChild(btn);
    });

    // Language toggle
    if (row === layout[layout.length - 1]) {
      const langBtn = document.createElement('button');
      langBtn.className = 'key special';
      langBtn.style.maxWidth = '50px';
      langBtn.style.flex = '1.5';
      langBtn.textContent = currentLayout === 'ar' ? 'EN' : (currentLayout === 'en' ? 'عر' : 'EN');
      langBtn.onclick = () => {
        if (currentLayout === 'ar') currentLayout = 'en';
        else if (currentLayout === 'en') currentLayout = 'ar';
        else currentLayout = 'en';
        renderKeyboard();
      };
      rowEl.insertBefore(langBtn, rowEl.firstChild);
    }

    kb.appendChild(rowEl);
  });
}

function insertChar(char) {
  if (!activeEditable) return;
  const sel = window.getSelection();
  if (sel.rangeCount) {
    const range = sel.getRangeAt(0);
    if (!activeEditable.contains(range.commonAncestorContainer)) {
      // Place cursor at end
      const range2 = document.createRange();
      range2.selectNodeContents(activeEditable);
      range2.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range2);
    }
    // Insert text
    document.execCommand('insertText', false, char);
  } else {
    activeEditable.textContent += char;
  }
  saveCurrentPageContent();
}

function deleteChar() {
  if (!activeEditable) return;
  document.execCommand('delete', false);
  saveCurrentPageContent();
}

function showKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.classList.add('active');
  isKeyboardOpen = true;
  // Find first editable on current page
  const wrapper = document.querySelector(`[data-page-index="${state.currentPage}"]`);
  if (wrapper) {
    const editable = wrapper.querySelector('[contenteditable="true"]');
    if (editable) {
      setActiveEditable(editable);
      editable.focus();
    }
  }
}

function hideKeyboard() {
  document.getElementById('keyboard').classList.remove('active');
  isKeyboardOpen = false;
}

function setActiveEditable(el) {
  activeEditable = el;
}

// ===== CONTENT EDITING =====
document.addEventListener('focusin', (e) => {
  if (e.target.hasAttribute('contenteditable')) {
    setActiveEditable(e.target);
    // Auto-show keyboard on mobile
    if (window.innerWidth < 900 && !isKeyboardOpen) {
      // Don't auto-show, let user use toolbar
    }
  }
});

document.addEventListener('input', (e) => {
  if (e.target.hasAttribute('contenteditable')) {
    saveCurrentPageContent();
  }
});

function saveCurrentPageContent() {
  const pageIdx = state.currentPage;
  const page = state.pages[pageIdx];
  if (!page) return;

  const wrapper = document.querySelector(`[data-page-index="${pageIdx}"]`);
  if (!wrapper) return;

  const editables = wrapper.querySelectorAll('[contenteditable="true"]');
  if (!page.data) page.data = {};
  editables.forEach(el => {
    const field = el.getAttribute('data-field');
    if (field) {
      page.data[field] = el.innerHTML;
    }
  });
  saveState();
}

// ===== MODALS =====
function showAddPageModal() { document.getElementById('addPageModal').classList.add('active'); }
function showStickerModal() { document.getElementById('stickerModal').classList.add('active'); }
function showColorModal() { document.getElementById('colorModal').classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', (e) => {
    if (e.target === m) m.classList.remove('active');
  });
});

// ===== PERSISTENCE =====
function saveState() {
  try {
    // Save content from DOM
    state.pages.forEach((page, idx) => {
      const wrapper = document.querySelector(`[data-page-index="${idx}"]`);
      if (wrapper) {
        const editables = wrapper.querySelectorAll('[contenteditable="true"]');
        if (!page.data) page.data = {};
        editables.forEach(el => {
          const field = el.getAttribute('data-field');
          if (field) page.data[field] = el.innerHTML;
        });
      }
    });
    // Don't save HTML (regenerated), save data + structure
    const toSave = {
      pages: state.pages.map(p => {
        const { html, ...rest } = p;
        return rest;
      }),
      currentPage: state.currentPage,
      lang: state.lang,
      theme: state.theme
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  } catch (e) {
    console.warn('Save failed (storage full?):', e);
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved.pages && saved.pages.length) {
      // Regenerate HTML from saved data
      state.pages = saved.pages.map(p => {
        const regenerated = createPageHTML(p.type, { ...p, ...p.data });
        // Preserve audio and stickers
        regenerated.audioSrc = p.audioSrc;
        regenerated.stickers = p.stickers || [];
        return regenerated;
      });
      state.currentPage = saved.currentPage || 0;
      state.lang = saved.lang || 'ar';
      state.theme = saved.theme || 'default';
    }
  } catch (e) {
    console.warn('Load failed:', e);
  }
}

function exportDiary() {
  saveState();
  const data = {
    version: 1,
    exportDate: new Date().toISOString(),
    pages: state.pages.map(p => {
      const { html, ...rest } = p;
      return rest;
    })
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `memory-diary-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('📤 تم التصدير');
}

// ===== LANGUAGE =====
function toggleLang() {
  state.lang = state.lang === 'ar' ? 'en' : 'ar';
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  saveState();
  showToast(state.lang === 'ar' ? '🌐 العربية' : '🌐 English');
}

// ===== TOAST =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') flipPrev();
  if (e.key === 'ArrowLeft') flipNext();
  if (e.key === 'Escape') {
    hideKeyboard();
    document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
  }
});

// ===== RESIZE HANDLER =====
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (pageFlip) {
      const savedPage = state.currentPage;
      initBook();
      setTimeout(() => {
        if (pageFlip) pageFlip.flip(savedPage);
      }, 300);
    }
  }, 300);
});

// Prevent double-tap zoom on iOS
let lastTouch = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouch < 300) e.preventDefault();
  lastTouch = now;
}, { passive: false });

// GSAP entrance animations
window.addEventListener('load', () => {
  if (window.gsap) {
    gsap.from('.welcome-book', { duration: 1.5, y: 50, opacity: 0, ease: 'power3.out' });
    gsap.from('.welcome-title', { duration: 1.5, delay: 0.3, y: 30, opacity: 0, ease: 'power3.out' });
    gsap.from('.welcome-subtitle', { duration: 1.5, delay: 0.5, y: 30, opacity: 0, ease: 'power3.out' });
    gsap.from('.welcome-btn', { duration: 1.5, delay: 0.7, y: 30, opacity: 0, ease: 'power3.out' });
  }
});
</script>
